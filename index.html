<style>
/* ============================================================
   TOKENS DE DISEÑO
   ============================================================ */
:root {
  --burdeos:     #8B2252;
  --burdeos-osc: #5C1636;
  --rosa-palido: #FFF0F5;
  --crema:       #FDF6F0;
  --coral:       #E8837A;
  --dorado:      #C9A96E;
  --texto:       #3A2030;
  --texto-suave: #7A5870;
  --blanco:      #FFFFFF;
  --sombra: 0 8px 40px rgba(139,34,82,0.12);
  --sombra-hover: 0 16px 60px rgba(139,34,82,0.22);
  --radio: 20px;
  --transicion: 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Lato', sans-serif;
  background: var(--crema);
  color: var(--texto);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Fondo animado ────────────────────────────────────────── */
#canvas-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ── Contenedor principal ─────────────────────────────────── */
#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

/* ── Pantallas ────────────────────────────────────────────── */
.screen {
  display: none;
  width: 100%;
  max-width: 680px;
  animation: screenIn 0.6s var(--transicion) both;
}
.screen.active { display: flex; flex-direction: column; align-items: center; gap: 2rem; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Tarjeta tipo carta ───────────────────────────────────── */
.carta {
  background: var(--blanco);
  border-radius: var(--radio);
  padding: 2.5rem 2.8rem;
  box-shadow: var(--sombra);
  position: relative;
  width: 100%;
  /* Detalle: línea de acento superior */
}
.carta::before {
  content: '';
  position: absolute;
  top: 0; left: 2rem; right: 2rem;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--burdeos), var(--coral), transparent);
  border-radius: 0 0 4px 4px;
}

/* ── Tipografía ───────────────────────────────────────────── */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  color: var(--burdeos);
  line-height: 1.2;
  text-align: center;
  letter-spacing: -0.01em;
}
h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  color: var(--burdeos);
  line-height: 1.25;
  text-align: center;
}
.subtitulo {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1rem;
  color: var(--texto-suave);
  text-align: center;
}

/* ── Párrafos de disculpa ─────────────────────────────────── */
.texto-disculpa {
  font-size: 1.05rem;
  line-height: 1.85;
  color: var(--texto);
  white-space: pre-line;
  text-align: left;
}

/* ── Botones ──────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-family: 'Lato', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  padding: 0.85rem 2.4rem;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  transition: transform var(--transicion), box-shadow var(--transicion), background var(--transicion);
  position: relative;
  overflow: hidden;
  text-decoration: none;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
  opacity: 0;
  transition: opacity 0.25s;
}
.btn:hover::after { opacity: 1; }
.btn:hover { transform: translateY(-3px); box-shadow: var(--sombra-hover); }
.btn:active { transform: translateY(0); }

.btn-primario {
  background: linear-gradient(135deg, var(--burdeos), var(--coral));
  color: var(--blanco);
  box-shadow: 0 4px 20px rgba(139,34,82,0.3);
}
.btn-secundario {
  background: var(--blanco);
  color: var(--burdeos);
  border: 2px solid var(--burdeos);
  box-shadow: 0 4px 16px rgba(139,34,82,0.1);
}
.btn-secundario:hover { background: var(--rosa-palido); }

.btn-whatsapp {
  background: linear-gradient(135deg, #25D366, #128C7E);
  color: var(--blanco);
  box-shadow: 0 4px 20px rgba(37,211,102,0.35);
  font-size: 1.05rem;
  padding: 1rem 2.6rem;
}

.btn-grupo {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
}

/* ── Contador ─────────────────────────────────────────────── */
.contador-label {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--texto-suave);
  text-align: center;
}
.contador-display {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}
.contador-unidad {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(160deg, var(--rosa-palido), var(--blanco));
  border: 1px solid rgba(139,34,82,0.12);
  border-radius: 14px;
  padding: 1rem 1.4rem;
  min-width: 90px;
  box-shadow: 0 2px 12px rgba(139,34,82,0.08);
}
.contador-numero {
  font-family: 'Playfair Display', serif;
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--burdeos);
  line-height: 1;
  tabular-nums: all;
  font-variant-numeric: tabular-nums;
}
.contador-etiqueta {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--texto-suave);
  margin-top: 0.3rem;
}
.contador-epilogo {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--burdeos);
  text-align: center;
}

/* ── Pregunta ─────────────────────────────────────────────── */
#screen-pregunta h1 {
  font-size: clamp(2.5rem, 8vw, 4rem);
  animation: latido 2.4s ease-in-out infinite;
}
@keyframes latido {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}

/* ── Pantalla "No" ────────────────────────────────────────── */
.icono-triste {
  font-size: 4rem;
  animation: bamboleo 0.7s ease-in-out 3;
}
@keyframes bamboleo {
  0%,100% { transform: rotate(0deg); }
  25%     { transform: rotate(-12deg); }
  75%     { transform: rotate(12deg); }
}
.texto-no {
  font-size: 1.05rem;
  line-height: 1.8;
  color: var(--texto);
  text-align: center;
  white-space: pre-line;
}

/* ── Pantalla "Sí" ────────────────────────────────────────── */
#screen-si .mensaje-grande {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.5rem, 4.5vw, 2.1rem);
  color: var(--burdeos);
  text-align: center;
  line-height: 1.35;
  font-weight: 600;
}
#screen-si .mensaje-secundario {
  font-size: 1.1rem;
  color: var(--texto-suave);
  text-align: center;
  font-style: italic;
  font-family: 'Playfair Display', serif;
}
#screen-si .mensaje-extra {
  font-size: 1.1rem;
  color: var(--texto);
  text-align: center;
  font-weight: 700;
}

/* ── Galería Polaroid ─────────────────────────────────────── */
#galeria-seccion {
  width: 100%;
  max-width: 680px;
}
.galeria-titulo {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.3rem;
  color: var(--texto-suave);
  text-align: center;
  margin-bottom: 1.5rem;
}
.galeria-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 1.5rem;
  justify-items: center;
}
.polaroid {
  background: var(--blanco);
  padding: 0.9rem 0.9rem 2.2rem;
  box-shadow: 0 4px 18px rgba(139,34,82,0.14);
  border-radius: 4px;
  transform: rotate(var(--rot, -2deg));
  transition: transform var(--transicion), box-shadow var(--transicion);
  max-width: 220px;
  width: 100%;
}
.polaroid:nth-child(odd)  { --rot: -2deg; }
.polaroid:nth-child(even) { --rot: 2deg; }
.polaroid:hover {
  transform: rotate(0deg) scale(1.04);
  box-shadow: 0 12px 40px rgba(139,34,82,0.22);
  z-index: 2;
}
.polaroid img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  border-radius: 2px;
  background: var(--rosa-palido);
}
.polaroid-caption {
  font-family: 'Lato', sans-serif;
  font-size: 0.82rem;
  color: var(--texto-suave);
  text-align: center;
  margin-top: 0.7rem;
  min-height: 1.2rem;
}

/* ── Barra de contador fija ───────────────────────────────── */
#barra-contador {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(253,246,240,0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(139,34,82,0.12);
  padding: 0.5rem 1rem;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  box-shadow: 0 2px 16px rgba(139,34,82,0.08);
}
#barra-contador.visible { display: flex; }
.barra-label {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 0.78rem;
  color: var(--texto-suave);
  letter-spacing: 0.02em;
}
.barra-numeros {
  display: flex;
  gap: 0.5rem;
  align-items: baseline;
}
.barra-unidad {
  display: flex;
  align-items: baseline;
  gap: 0.2rem;
}
.barra-num {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--burdeos);
  font-variant-numeric: tabular-nums;
  min-width: 1.6ch;
  text-align: right;
}
.barra-etq {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.barra-sep {
  font-size: 1rem;
  color: var(--coral);
  font-weight: 300;
  opacity: 0.5;
}

/* Cuando la barra está visible, empujar el contenido */
body.con-barra #app { padding-top: 5rem; }

/* ── Confeti ──────────────────────────────────────────────── */
#confeti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  display: none;
}

/* ── Divider decorativo ───────────────────────────────────── */
.divider {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--dorado);
  font-size: 0.9rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--dorado), transparent);
}

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 480px) {
  .carta { padding: 2rem 1.5rem; }
  .contador-unidad { min-width: 70px; padding: 0.8rem 0.9rem; }
  .contador-numero { font-size: 1.9rem; }
  .btn { font-size: 0.92rem; padding: 0.8rem 1.8rem; }
  .galeria-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
}

/* ── Accesibilidad ────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

   INICIALIZACIÓN Y NAVEGACIÓN
   ============================================================ */

// Inyectar textos desde CONFIG

  document.getElementById('js-titulo').textContent         = CONFIG.titulo;
  document.getElementById('js-disculpa').textContent       = CONFIG.disculpa;
  document.getElementById('js-btn-seguir1').textContent    = CONFIG.btnSeguir1;

  document.getElementById('js-btn-seguir2').textContent    = CONFIG.btnSeguir2;
  document.getElementById('js-pregunta').textContent       = CONFIG.pregunta;
  document.getElementById('js-btn-si').textContent         = CONFIG.btnSi;
  document.getElementById('js-btn-no').textContent         = CONFIG.btnNo;
  document.getElementById('js-mensaje-no').textContent     = CONFIG.mensajeNo;
  document.getElementById('js-btn-volver').textContent     = CONFIG.btnVolverPensar;
  document.getElementById('js-si-principal').textContent   = CONFIG.mensajeSiPrincipal;
  document.getElementById('js-si-secundario').textContent  = CONFIG.mensajeSiSecundario;
  document.getElementById('js-si-extra').textContent       = CONFIG.mensajeSiExtra;

  // Botón WhatsApp
  const waUrl = `https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(CONFIG.whatsappMensaje)}`;
  const waBtn = document.getElementById('js-btn-whatsapp');
  waBtn.href        = waUrl;
  waBtn.textContent = CONFIG.btnWhatsapp;

  // Galería
  if (CONFIG.galeria && CONFIG.galeria.length > 0) {
    const seccion = document.getElementById('galeria-seccion');
    const grid    = document.getElementById('galeria-grid');
    seccion.style.display = 'block';
    CONFIG.galeria.forEach(item => {
      const card = document.createElement('div');
      card.className = 'polaroid';
      card.innerHTML = `
        <img src="${item.url}" alt="${item.caption || ''}" loading="lazy">
        <p class="polaroid-caption">${item.caption || ''}</p>
      `;
      grid.appendChild(card);
    });
  }

  // Arrancar contador y fondo
  iniciarContador();
  iniciarFondo();
});

// Navegar entre pantallas
function irA(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const destino = document.getElementById(id);
  destino.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Mostrar barra contador a partir de la pantalla 2
  const barra = document.getElementById('barra-contador');
  if (id === 'screen-inicio') {
    barra.classList.remove('visible');
    document.body.classList.remove('con-barra');
  } else {
    barra.classList.add('visible');
    document.body.classList.add('con-barra');
  }
}

/* ============================================================
   CONTADOR EN TIEMPO REAL
   ============================================================ */
function iniciarContador() {
  // Inyectar label en la barra
  document.getElementById('barra-label-txt').textContent = CONFIG.textoContador;

  function actualizar() {
    const ahora   = new Date();
    const diff    = Math.max(0, ahora - CONFIG.fechaInicio);
    const seg     = Math.floor(diff / 1000) % 60;
    const min     = Math.floor(diff / 60000) % 60;
    const horas   = Math.floor(diff / 3600000) % 24;
    const dias    = Math.floor(diff / 86400000);

    const d = String(dias).padStart(2,'0');
    const h = String(horas).padStart(2,'0');
    const m = String(min).padStart(2,'0');
    const s = String(seg).padStart(2,'0');

    // Pantalla 2
    document.getElementById('cnt-dias').textContent  = d;
    document.getElementById('cnt-horas').textContent = h;
    document.getElementById('cnt-min').textContent   = m;
    document.getElementById('cnt-seg').textContent   = s;

    // Barra fija
    document.getElementById('b-dias').textContent  = d;
    document.getElementById('b-horas').textContent = h;
    document.getElementById('b-min').textContent   = m;
    document.getElementById('b-seg').textContent   = s;
  }
  actualizar();
  setInterval(actualizar, 1000);
}

/* ============================================================
   FONDO ANIMADO: PARTÍCULAS FLOTANTES
   ============================================================ */
function iniciarFondo() {
  const canvas = document.getElementById('canvas-bg');
  const ctx    = canvas.getContext('2d');
  let W, H, particulas;

  const SIMBOLOS = ['❤️','✦','✿','·','◦'];
  const COLORES  = ['rgba(139,34,82,', 'rgba(232,131,122,', 'rgba(201,169,110,'];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function crearParticulas() {
    particulas = Array.from({ length: 38 }, () => ({
      x:    Math.random() * W,
      y:    Math.random() * H,
      vy:   -(0.18 + Math.random() * 0.35),
      vx:   (Math.random() - 0.5) * 0.2,
      size: 8 + Math.random() * 14,
      op:   0.04 + Math.random() * 0.13,
      sym:  SIMBOLOS[Math.floor(Math.random() * SIMBOLOS.length)],
      col:  COLORES[Math.floor(Math.random() * COLORES.length)],
    }));
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particulas.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.op;
      ctx.font = `${p.size}px serif`;
      ctx.fillStyle = p.col + p.op + ')';
      ctx.fillText(p.sym, p.x, p.y);
      ctx.restore();

      p.y += p.vy;
      p.x += p.vx;
      if (p.y < -30) { p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -30) p.x = W + 20;
      if (p.x > W+30) p.x = -20;
    });
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); crearParticulas(); });
  resize();
  crearParticulas();
  loop();
}

/* ============================================================
   CONFETI DE CORAZONES
   ============================================================ */
function lanzarConfeti() {
  const canvas = document.getElementById('confeti-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const piezas = Array.from({ length: 70 }, () => ({
    x:    Math.random() * canvas.width,
    y:    -20 - Math.random() * 200,
    vy:   2.5 + Math.random() * 3.5,
    vx:   (Math.random() - 0.5) * 2.5,
    rot:  Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 0.12,
    size: 12 + Math.random() * 16,
    op:   0.7 + Math.random() * 0.3,
    sym:  ['❤️','🌸','✨','💕','✦'][Math.floor(Math.random()*5)],
  }));

  let frames = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    piezas.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.op;
      ctx.font = `${p.size}px serif`;
      ctx.fillText(p.sym, -p.size/2, p.size/2);
      ctx.restore();

      p.y   += p.vy;
      p.x   += p.vx;
      p.rot += p.vrot;
      p.op  -= 0.004;
    });
    frames++;
    if (frames < 220) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}
</script>
